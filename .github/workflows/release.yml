name: Build and Release

on:
  push:
    branches: [main]
    paths: ['npm/package.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack every platform without publishing
        type: boolean
        default: true
        required: true
      verify_trust:
        description: Verify npm OIDC trust without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  version:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      validate: ${{ steps.release.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check version and all six registry packages
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/npm-release.mjs check

  test:
    needs: version
    if: needs.version.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  test-windows-lock:
    needs: version
    if: needs.version.outputs.validate == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/cli -run 'Test(AcquireFileLock|ReleaseFileLock|ConcurrentFileLocking)$'

  build:
    needs: [version, test, test-windows-lock]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            suffix: Darwin-x86_64
            npm_platform: darwin-x64
          - goos: darwin
            goarch: arm64
            suffix: Darwin-arm64
            npm_platform: darwin-arm64
          - goos: linux
            goarch: amd64
            suffix: Linux-x86_64
            npm_platform: linux-x64
          - goos: linux
            goarch: arm64
            suffix: Linux-arm64
            npm_platform: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: Windows-x86_64.exe
            npm_platform: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build platform binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: go build -ldflags="-s -w -X main.version=v${RELEASE_VERSION}" -o "tool-hub-mcp-${BINARY_SUFFIX}" ./cmd/tool-hub-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: tool-hub-mcp-${{ matrix.suffix }}
          path: tool-hub-mcp-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-platform-${{ matrix.npm_platform }}
          path: tool-hub-mcp-${{ matrix.suffix }}

  release:
    needs: build
    if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tool-hub-mcp-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: npm-platform-*
      - name: Verify npm trusted publishing
        if: github.event_name == 'workflow_dispatch' && inputs.verify_trust
        run: node .github/scripts/verify-npm-trust.mjs @khanglvm/tool-hub-mcp @khanglvm/tool-hub-mcp-darwin-arm64 @khanglvm/tool-hub-mcp-darwin-x64 @khanglvm/tool-hub-mcp-linux-x64 @khanglvm/tool-hub-mcp-linux-arm64 @khanglvm/tool-hub-mcp-win32-x64
      - name: Prepare and pack all six npm packages
        run: node .github/scripts/npm-release.mjs prepare
      - name: Publish packages or validate dry run
        run: node .github/scripts/npm-release.mjs publish
